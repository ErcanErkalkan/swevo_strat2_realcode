[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ede-sustainable-vrptw"
version = "0.1.1"
description = "Reproducible evidence-locked E-DE experiment and submission pipeline for sustainability-aware shift-indexed VRPTW"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=3.0.1",
  "numpy>=2.4.3",
  "scipy>=1.17.1",
  "statsmodels>=0.14.6",
  "Jinja2>=3.1.6",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
release = ["pypdf>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
