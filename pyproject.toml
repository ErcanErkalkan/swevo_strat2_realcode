[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ede-sustainable-vrptw"
version = "0.1.0"
description = "Reproducible evidence-locked E-DE experiment and submission pipeline for sustainability-aware shift-indexed VRPTW"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "Jinja2>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
release = ["pypdf>=4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
