primary_fairness_currency: wall_clock_by_tier
runtime_validation_tolerance_s: 10
budgets:
  small:
    customers: 100
    nominal_outer_step_guard: 25050
    walltime_cap_s: 1800
  medium:
    customers: 200
    nominal_outer_step_guard: 40080
    walltime_cap_s: 3600
  large:
    customers: 400
    nominal_outer_step_guard: 80100
    walltime_cap_s: 7200
shared_constants:
  overtime_cap_eta: 0.05
  overtime_penalty_kappa_shift: 0.25
  epsilon: 1.0e-9
  epsilon_energy: 1.0e-9
  objective_weights:
    cost: 1.0
    energy: 1.0
    co2: 1.0
  jde:
    pF: 0.10
    pCR: 0.10
    F_range: [0.50, 0.95]
    CR_range: [0.60, 1.00]
  lns:
    period_generations: 10
notes:
  - "Runtime-cap validation permits at most 10 s of logging/scheduling tolerance; this is not additional search budget."
  - "Wall-clock time, not eval_budget, is the submission-primary fairness currency."
  - "The outer-step guard is not a complete nested objective-evaluation count."
  - "Method-specific repair/local-search/population settings are defined in comparator code and reported in the manuscript reproducibility appendix."
